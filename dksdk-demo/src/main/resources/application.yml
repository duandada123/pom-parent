spring:
  application:
    name: dksdk-demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

dataworks:
  endpoint: ${DATAWORKS_ENDPOINT:}
  region-id: ${DATAWORKS_REGION_ID:cn-hangzhou}
  project-id: ${DATAWORKS_PROJECT_ID:0}
  access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
  access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
  security-token: ${ALIBABA_CLOUD_SECURITY_TOKEN:}
  bizdate-zone: Asia/Shanghai
  call-timeout-seconds: 20
  max-node-pages: 20
